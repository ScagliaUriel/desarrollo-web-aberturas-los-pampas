<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aberturas Los Pampas — Prototipo</title>
<style>
:root{
  --navy:#1f3b57; --gold:#b8863b; --grey:#666; --light:#f2efea; --bg:#fafafa;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:#222;min-height:100%;}
header{background:var(--navy);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top,0px));}
header h1{margin:0;font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;background:#16293c;padding:8px 10px;}
nav button{flex:none;background:none;border:1px solid #3a5674;color:#cfe0f0;padding:8px 12px;border-radius:20px;font-size:13px;cursor:pointer;}
nav button.active{background:var(--gold);color:#fff;border-color:var(--gold);}
main{max-width:520px;margin:0 auto;padding:16px;padding-bottom:60px;}
.view{display:none}
.view.active{display:block}
h2{color:var(--navy);font-size:19px;margin:6px 0 14px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:12px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:hidden;cursor:pointer;}
.prod .ph{background:var(--light);height:90px;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;}
.prod .info{padding:8px}
.prod .info b{display:block;font-size:13px;margin-bottom:2px}
.prod .info span{color:var(--gold);font-weight:bold;font-size:13px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;color:#555;margin-left:6px}
.badge.low{background:#fde8e8;color:#b33}
label{display:block;font-size:12px;color:var(--grey);margin:10px 0 4px}
input,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:bold;width:100%;cursor:pointer;margin-top:14px;}
button.primary:active{opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee;}
.row:last-child{border-bottom:none}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;}
.total{font-size:17px;font-weight:bold;color:var(--navy);text-align:right;margin-top:10px}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-top:10px;display:none}
.msg.ok{background:#e4f7e4;color:#276b27;display:block}
.msg.err{background:#fde8e8;color:#a33;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
th{color:var(--grey);font-weight:normal}
.estado{padding:2px 8px;border-radius:10px;font-size:11px;background:#e6edf5;color:var(--navy)}
.empty{color:#999;text-align:center;padding:30px 0;font-size:14px}
.note{font-size:11px;color:#999;margin-top:18px;text-align:center}
</style>
</head>
<body>

<header>
  <h1>Aberturas Los Pampas</h1>
</header>
<nav id="nav"></nav>

<main>

  <section id="v-catalogo" class="view">
    <h2>Catálogo</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="v-producto" class="view">
    <h2 id="p-nombre">Producto</h2>
    <div class="card">
      <div class="ph" style="height:140px;background:var(--light);display:flex;align-items:center;justify-content:center;color:#999;border-radius:8px;margin-bottom:10px">[ foto ]</div>
      <div id="p-precio" style="font-size:16px;font-weight:bold;color:var(--gold)"></div>
      <label><input type="checkbox" id="p-medida" style="width:auto;display:inline-block"> Solicitar a medida</label>
      <div id="p-medida-form" style="display:none">
        <label>Alto (m)</label><input id="m-alto" type="number" step="0.1" placeholder="1.20">
        <label>Ancho (m)</label><input id="m-ancho" type="number" step="0.1" placeholder="1.00">
        <label>Material</label>
        <select id="m-material"><option>Aluminio</option><option>Chapa</option><option>Madera</option><option>Hierro</option></select>
        <label>Tipo de vidrio</label>
        <select id="m-vidrio"><option>Simple</option><option>Laminado</option><option>DVH</option></select>
        <button class="primary" onclick="cotizar()">Enviar solicitud de cotización</button>
        <div id="m-msg" class="msg"></div>
      </div>
      <button class="primary" id="p-add" onclick="agregarCarrito()">Agregar al carrito</button>
    </div>
  </section>

  <section id="v-carrito" class="view">
    <h2>Carrito</h2>
    <div class="card" id="carrito-box"></div>
    <div class="total" id="carrito-total"></div>
    <button class="primary" onclick="ir('checkout')" id="btn-checkout" >Confirmar compra</button>
  </section>

  <section id="v-checkout" class="view">
    <h2>Checkout</h2>
    <div class="card">
      <div id="resumen"></div>
      <label>Nombre y apellido</label><input id="c-nombre" placeholder="Juan Pérez">
      <label>Dirección de entrega / instalación</label><input id="c-dir" placeholder="Calle 123, Rosario">
      <button class="primary" onclick="pagar()">Pagar con Mercado Pago</button>
      <div id="pago-msg" class="msg"></div>
    </div>
  </section>

  <section id="v-panel" class="view">
    <h2>Panel interno</h2>
    <div class="card" id="login-box">
      <label>Usuario</label><input id="u-user" placeholder="vendedor@lospampas.com">
      <label>Contraseña</label><input id="u-pass" type="password" placeholder="••••••••">
      <button class="primary" onclick="login()">Ingresar</button>
    </div>
    <div id="panel-content" style="display:none">
      <div class="card">
        <b>Pedidos</b>
        <table><thead><tr><th>ID</th><th>Cliente</th><th>Estado</th><th>Total</th></tr></thead>
        <tbody id="tabla-pedidos"></tbody></table>
      </div>
      <div class="card">
        <b>Stock bajo</b>
        <table><thead><tr><th>Producto</th><th>Stock</th></tr></thead>
        <tbody>
          <tr><td>Portón Chapa 2.40x2.20</td><td class="badge low">2</td></tr>
          <tr><td>Reja Hierro 1.00x1.50</td><td class="badge low">1</td></tr>
        </tbody></table>
      </div>
    </div>
  </section>

  <p class="note">Prototipo funcional de demostración · datos en memoria, sin backend real · Aberturas Los Pampas</p>
</main>

<script>
const productos = [
  {id:1, nombre:"Ventana Aluminio 1.20×1.00", precio:85000, stock:12},
  {id:2, nombre:"Portón Chapa 2.40×2.20", precio:210000, stock:2},
  {id:3, nombre:"Puerta Madera 0.90×2.00", precio:120000, stock:8},
  {id:4, nombre:"Reja Hierro 1.00×1.50", precio:65000, stock:1},
];
let carrito = [];
let ultimoId = 0;
let solicitudN = 244;

const pedidosDemo = [
  {id:1001, cliente:"María López", estado:"Pagado", total:85000},
  {id:1002, cliente:"Constructora SRL", estado:"En preparación", total:420000},
  {id:1003, cliente:"Juan Pérez", estado:"Pendiente de pago", total:120000},
];

const tabs = [
  {id:"catalogo", label:"Catálogo"},
  {id:"carrito", label:"Carrito"},
  {id:"panel", label:"Panel interno"},
];
document.getElementById('nav').innerHTML = tabs.map(t=>`<button data-t="${t.id}" onclick="ir('${t.id}')">${t.label}</button>`).join('');

function ir(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+view).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active', b.dataset.t===view));
  if(view==='carrito') renderCarrito();
  if(view==='checkout') renderResumen();
}

function renderGrid(){
  document.getElementById('grid').innerHTML = productos.map(p=>`
    <div class="prod" onclick="verProducto(${p.id})">
      <div class="ph">[ foto ]</div>
      <div class="info">
        <b>${p.nombre}</b>
        <span>$ ${p.precio.toLocaleString('es-AR')}</span>
        ${p.stock<=2?'<span class="badge low">Stock bajo</span>':''}
      </div>
    </div>`).join('');
}
renderGrid();

function verProducto(id){
  ultimoId = id;
  const p = productos.find(x=>x.id===id);
  document.getElementById('p-nombre').textContent = p.nombre;
  document.getElementById('p-precio').textContent = '$ ' + p.precio.toLocaleString('es-AR') + (p.stock<=2?' · Stock bajo':' · Stock disponible');
  document.getElementById('p-medida').checked = false;
  document.getElementById('p-medida-form').style.display = 'none';
  document.getElementById('m-msg').className = 'msg';
  document.getElementById('p-add').style.display = 'block';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-producto').classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
}
document.getElementById('p-medida').addEventListener('change', e=>{
  document.getElementById('p-medida-form').style.display = e.target.checked ? 'block':'none';
  document.getElementById('p-add').style.display = e.target.checked ? 'none':'block';
});

function cotizar(){
  const alto = parseFloat(document.getElementById('m-alto').value);
  const ancho = parseFloat(document.getElementById('m-ancho').value);
  const msg = document.getElementById('m-msg');
  if(!alto || !ancho || alto<0.5 || ancho<0.5){
    msg.className = 'msg err';
    msg.textContent = "Las dimensiones están fuera del rango estándar de fabricación.";
    return;
  }
  solicitudN++;
  msg.className = 'msg ok';
  msg.textContent = `Solicitud N° ${solicitudN} generada — Pendiente de revisión técnica. Te contactamos a la brevedad.`;
}

function agregarCarrito(){
  const p = productos.find(x=>x.id===ultimoId);
  const existente = carrito.find(i=>i.id===p.id);
  if(existente) existente.cant++; else carrito.push({...p, cant:1, instalacion:false});
  ir('carrito');
}

function renderCarrito(){
  const box = document.getElementById('carrito-box');
  if(carrito.length===0){
    box.innerHTML = '<div class="empty">Tu carrito está vacío</div>';
    document.getElementById('carrito-total').textContent = '';
    document.getElementById('btn-checkout').style.display='none';
    return;
  }
  document.getElementById('btn-checkout').style.display='block';
  box.innerHTML = carrito.map((i,idx)=>`
    <div class="row">
      <div>
        <b style="font-size:13px">${i.nombre}</b><br>
        <label style="margin:4px 0 0"><input type="checkbox" style="width:auto;display:inline-block" ${i.instalacion?'checked':''} onchange="toggleInst(${idx})"> Solicitar instalación</label>
      </div>
      <div class="qty">
        <button onclick="cambiarCant(${idx},-1)">−</button>${i.cant}<button onclick="cambiarCant(${idx},1)">+</button>
      </div>
      <div>$ ${(i.precio*i.cant).toLocaleString('es-AR')}</div>
    </div>`).join('');
  const total = carrito.reduce((a,i)=>a+i.precio*i.cant,0);
  document.getElementById('carrito-total').textContent = 'Total: $ ' + total.toLocaleString('es-AR');
}
function cambiarCant(idx,d){ carrito[idx].cant+=d; if(carrito[idx].cant<=0) carrito.splice(idx,1); renderCarrito(); }
function toggleInst(idx){ carrito[idx].instalacion = !carrito[idx].instalacion; }

function renderResumen(){
  const total = carrito.reduce((a,i)=>a+i.precio*i.cant,0);
  document.getElementById('resumen').innerHTML = `<b>${carrito.length} producto(s)</b> · Total: $ ${total.toLocaleString('es-AR')}`;
  document.getElementById('pago-msg').className='msg';
}
function pagar(){
  const nombre = document.getElementById('c-nombre').value;
  const msg = document.getElementById('pago-msg');
  if(!nombre){ msg.className='msg err'; msg.textContent='Completá tu nombre antes de pagar.'; return; }
  msg.className='msg ok';
  msg.textContent = `Pago aprobado ✓ Pedido #${1004+Math.floor(Math.random()*90)} confirmado. Comprobante enviado por e-mail.`;
  carrito = [];
}

function login(){
  document.getElementById('login-box').style.display='none';
  document.getElementById('panel-content').style.display='block';
  document.getElementById('tabla-pedidos').innerHTML = pedidosDemo.map(p=>`
    <tr><td>#${p.id}</td><td>${p.cliente}</td><td><span class="estado">${p.estado}</span></td><td>$ ${p.total.toLocaleString('es-AR')}</td></tr>
  `).join('');
}

ir('catalogo');
</script>
</body>
</html>
